name: assistant-chat-backend

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: assistant-backend
    restart: unless-stopped
    env_file:
      - .env
    command: ["python", "-m", "app.run"]
    ports:
      - "8000:8000"
    networks:
      - assistant-net

networks:
  assistant-net:
    external: true
    name: assistant-net
