name: Tests

on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  ruff:
    runs-on: ubuntu-latest
    name: Ruff linting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --extras dev

      - name: Check code with ruff
        run: poetry run ruff check .

  black:
    runs-on: ubuntu-latest
    name: Black formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --extras dev

      - name: Check code formatting with black
        run: poetry run black --check .

  mypy:
    runs-on: ubuntu-latest
    name: Mypy type check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --extras dev

      - name: Run mypy
        run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    name: Run tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi --extras dev

      - name: Run tests
        run: poetry run pytest src/tests/ -v
