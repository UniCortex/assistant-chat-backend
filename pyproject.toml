[tool.poetry]
packages = [{ include = "app", from = "src" }]

[project]
name = "assistant-chat-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "NEZuko1337",email = "zuko13371@yandex.ru"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "uvloop>=0.20.0",
    "dishka>=1.3.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "nats-py>=2.9.0",
    "redis[asyncio]>=5.0.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "black"
]

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
line-length = 156
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "BLE"]
ignore = ["E501"]

[tool.black]
target-version = ["py313"]
line-length = 156

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
allow_subclassing_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src/tests"]
pythonpath = ["src"]
